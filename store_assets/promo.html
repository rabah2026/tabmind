<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo Tile 440x280</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 440px;
      height: 280px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #090d16 75%, #05070d 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
    }
    .grid-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: 24px 24px;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      pointer-events: none;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 16px rgba(99, 102, 241, 0.6));
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.6px;
      background: linear-gradient(135deg, #ffffff 30%, #c7d2fe 70%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #818cf8;
      letter-spacing: -0.2px;
      margin-bottom: 14px;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 10.5px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .dot-green {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <svg class="logo-badge" viewBox="0 0 24 24" fill="none">
    <polygon points="12 2 21 7.5 21 16.5 12 22 3 16.5 3 7.5" stroke="url(#grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="3.2" fill="url(#grad)"/>
    <line x1="12" y1="2" x2="12" y2="9" stroke="url(#grad)" stroke-width="1.4"/>
    <line x1="12" y1="15" x2="12" y2="22" stroke="url(#grad)" stroke-width="1.4"/>
    <line x1="3" y1="7.5" x2="9.5" y2="10.5" stroke="url(#grad)" stroke-width="1.4"/>
    <line x1="14.5" y1="13.5" x2="21" y2="16.5" stroke="url(#grad)" stroke-width="1.4"/>
    <defs>
      <linearGradient id="grad" x1="3" y1="2" x2="21" y2="22">
        <stop stop-color="#6366f1"/>
        <stop offset="0.5" stop-color="#8b5cf6"/>
        <stop offset="1" stop-color="#06b6d4"/>
      </linearGradient>
    </defs>
  </svg>
  <h1 class="title">TabMind</h1>
  <div class="subtitle">Local AI Tab Assistant</div>
  <div class="badge-pill">
    <span class="dot-green"></span>
    <span>100% On-Device • Ollama & Gemini Nano</span>
  </div>
</body>
</html>
